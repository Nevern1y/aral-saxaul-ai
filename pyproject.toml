[tool.ruff]
line-length = 100
target-version = "py312"
# Pipeline scripts are exploratory; lint the app + library + tests strictly.
extend-exclude = ["outputs", "cache", "__pycache__"]

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus I (import sorting) and UP (pyupgrade).
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Streamlit's bare-mode + components warnings are noise in CI output.
filterwarnings = [
    "ignore::DeprecationWarning",
]
